
<div class="login-container">
  <div class="login-card">

    <div class="login-header">

      <div class="login-icon">
        <i class="bi bi-mortarboard-fill"></i>
      </div>

      <h1>¡Bienvenido!</h1>
      <p>Ingresa a tu Asistente Universitario</p>

    </div>

    <form
      class="login-form"
      [formGroup]="formlogin"
      (ngSubmit)="IniciarSesion()">

      <div class="input-group">
        <label for="email">Correo electrónico</label>

        <div class="input-container">
          <i class="bi bi-envelope"></i>

          <input
            formControlName="email"
            type="email"
            id="email"
            placeholder="ejemplo@correo.com"
            autocomplete="email"
            required>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>

        <div class="input-container">
          <i class="bi bi-lock"></i>

          <input
            formControlName="password"
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required>
        </div>
      </div>

      <div class="login-options">
        <label class="remember">
          <input type="checkbox">
          <span>Recordarme</span>
        </label>

        <a routerLink="/auth/login" class="forgot-password">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <div class="login-error" *ngIf="mensajeError">
        <i class="bi bi-exclamation-circle"></i>
        {{ mensajeError }}
      </div>

      <button type="submit" class="login-button">
        Iniciar sesión
        <i class="bi bi-arrow-right"></i>
      </button>

    </form>

    <div class="login-footer">
      <p>
        ¿No tienes una cuenta?
        <a routerLink="/auth/register">Crear cuenta</a>
      </p>
    </div>

    <div class="login-bottom">
      <i class="bi bi-shield-check"></i>
      Tu espacio académico comienza aquí
    </div>

  </div>
</div>
