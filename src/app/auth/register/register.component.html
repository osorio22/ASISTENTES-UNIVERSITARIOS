 
<div class="register-container">
  <div class="register-card">

    <div class="register-icon">
      <i class="bi bi-mortarboard-fill"></i>
    </div>

    <h2>Crear una cuenta</h2>
    <p class="subtitle">
      Únete a nuestro Asistente Universitario
    </p>

    <form
      [formGroup]="formregister"
      (ngSubmit)="RegistrarUsuario()"
      *ngIf="!registroExitoso">

      <div class="form-group">
        <label>Nombre completo</label>
        <div class="input-container">
          <i class="bi bi-person"></i>
          <input
            type="text"
            formControlName="nombre"
            placeholder="Ingresa tu nombre completo">
        </div>
      </div>

      <div class="form-group">
        <label>Correo electrónico</label>
        <div class="input-container">
          <i class="bi bi-envelope"></i>
          <input
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com">
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-container">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            formControlName="password"
            placeholder="Mínimo 6 caracteres">
        </div>
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <div class="input-container">
          <i class="bi bi-shield-lock"></i>
          <input
            type="password"
            formControlName="confirmPassword"
            placeholder="Repite tu contraseña">
        </div>
      </div>

      <div class="error-message" *ngIf="mensajeError">
        <i class="bi bi-exclamation-circle"></i>
        {{ mensajeError }}
      </div>

      <button type="submit" class="register-button">
        Crear mi cuenta
        <i class="bi bi-arrow-right"></i>
      </button>

    </form>

    <div class="success-message" *ngIf="registroExitoso">
      <i class="bi bi-check-circle-fill"></i>
      <h3>¡Registro exitoso!</h3>
      <p>Tu cuenta ha sido creada correctamente.</p>
      <a routerLink="/auth/login" class="login-button">
        Ir al inicio de sesión
      </a>
    </div>

    <div class="login-link">
      ¿Ya tienes una cuenta?
      <a routerLink="/auth/login">Iniciar sesión</a>
    </div>

  </div>
</div>
